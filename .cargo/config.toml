[alias]
xtask = "run --quiet --package xtask --"

# **A host test thread's default stack (2 MiB on macOS) is too small for `video_terminal::Vt`**
# since milestone 142's grid growth (128x64 -> 1280x720, DECISIONS §102): the type is hundreds of
# KiB (`crates/video_terminal/src/lib.rs`'s own doc comment on `Vt`), and a debug build's
# unoptimized frames stack several such values deep in some tests (`cargo test -p video_terminal`
# overflowed and `SIGABRT`ed before this was set, reproducibly, on the crate's own host tests, which
# is the one place this project promised would run in milliseconds without needing a workaround).
# 16 MiB is comfortably past what any test here needs (8 MiB already sufficed, measured) and costs
# nothing: `RUST_MIN_STACK` only sets a floor libtest requests per spawned test thread, not memory
# actually touched. Kernel-side code does not get this for free (a QEMU-run thread's stack is fixed
# by `kernel/src/thread.rs`, not by this variable) and instead avoids ever putting a `Vt` on a
# stack at all; see `Vt`'s own doc comment and `script/stack-frame-check`.
[env]
RUST_MIN_STACK = "16777216"

# `cargo run -p kernel --target aarch64-unknown-none-softfloat` and
# `cargo test -p kernel --target aarch64-unknown-none-softfloat` both work because of
# this runner: cargo appends the built ELF path to the end of the command.
#
# It is a script rather than a bare qemu invocation because QEMU only follows the
# Linux arm64 boot protocol (and only hands us a device tree) for a flat `Image`, not
# for an ELF. The script strips the ELF to a flat binary first. See
# helpers/qemu-runner-aarch64.sh and notes/boot-protocol.md.
[target.aarch64-unknown-none-softfloat]
runner = "helpers/qemu-runner-aarch64.sh"

# RISC-V (milestone 20). Unlike aarch64, QEMU's virt machine boots a riscv ELF directly via
# `-kernel` (OpenSBI in `-bios` hands off in S-mode), so the runner needs no flat-binary step.
# See helpers/qemu-runner-riscv64.sh and notes/riscv-port.md.
[target.riscv64imac-unknown-none-elf]
runner = "helpers/qemu-runner-riscv64.sh"

# x86_64 (milestone 161). QEMU's `q35` boots the ELF directly through the PVH note in the image
# (there is no OpenSBI to hand off and no arm64 Image header to strip), so the runner is the
# simplest of the three. See helpers/qemu-runner-x86_64.sh and notes/x86-port.md.
[target.x86_64-unknown-none]
runner = "helpers/qemu-runner-x86_64.sh"
# `x86_64-unknown-none` defaults to a static-PIE, which a kernel cannot be: nothing relocates us,
# and the boot trampoline is linked at a physical address 4 GiB below the rest of the image, so a
# position-independent image would resolve its own symbols against whichever of the two worlds the
# loader happened to pick as the base. The other two kernel targets are static already; this one
# has to be told. The target's `code-model: kernel` is what fixes KERNEL_VA_BASE at
# 0xffffffff80000000, and link-x86_64.ld's header explains why that is not a free choice.
#
# `--cfg aes_force_soft` (milestone 164) is the second flag, and it is here rather than scoped to
# one package because cargo has no way to ADD a flag: `RUSTFLAGS` and `--config
# target.*.rustflags` both REPLACE this list, so scoping the cfg to the FS-server build would mean
# restating `relocation-model=static` in `xtask/src/main.rs`, away from the paragraph above that
# explains why the kernel needs it. One copy in one place, and the cost of that choice is stated
# here rather than left to be discovered: EVERY crate built for this target gets the cfg, the
# kernel included, because unlike aarch64 and riscv64 this architecture has one target for both
# the kernel and userspace.
#
# It is inert everywhere but one crate. `aes` 0.8.4 picks its backend in `src/lib.rs` with
# `cfg_if`, and every architecture-specific arm is gated `not(aes_force_soft)`; setting the cfg
# selects the portable constant-time software backend in `aes/src/soft/` instead. Nothing else in
# this tree reads the name. Without it, `aes` (which the vendored RedoxFS engine depends on
# unconditionally) fails to codegen at every optimization level with
# `rustc-LLVM ERROR: Do not know how to split the result of this operator!`, because this target is
# `-mmx,-sse,+soft-float` and there is no 128-bit vector register to legalize an AES block into.
# That is milestone 164's whole blocker; see design/roadmap/0164-x86-64-fs-server-aes.md.
#
# BUGS: a typo in the cfg name is silent. `--cfg` on the command line is not checked against
# `--check-cfg` by `unexpected_cfgs` (measured: `--cfg aes_force_sotf` on a clean rebuild of
# `crates/abi` warns about nothing), and pairing a `--check-cfg cfg(aes_force_soft)` here does not
# change that, so the pairing was dropped rather than kept as a comment claiming a guard it does
# not provide. What actually catches a typo is the FS-server build failing with the LLVM error
# above, which is loud, immediate, and the only consumer there is.
rustflags = ["-C", "relocation-model=static", "--cfg", "aes_force_soft"]
