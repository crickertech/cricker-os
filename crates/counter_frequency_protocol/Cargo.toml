[package]
name = "counter_frequency_protocol"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The x86_64 timebase page (milestone 161's cntfrq follow-up, DECISIONS §121's calibration path):
# one definition of the read-only page that carries the TSC's calibrated rate into every
# ELF-loaded x86_64 process, so the kernel (which computes the number once, at boot) and
# `user_mode_runtime::cntfrq` (which reads it, ambiently, once per process) cannot drift on the page's
# layout or its fixed virtual address. The same split `clock_protocol` makes for the wall clock and
# `environment_protocol` makes for TZ/LANG/TERM: a magic-prefixed page, one writer before the page
# has a second observer, no seqlock needed for the same reason neither of those needs one for
# their own single-writer-then-read-only halves.

[lints]
workspace = true

[dependencies]

# The address-space map (milestone 206 (a program image has under 896 KiB)) is a DEV-dependency on purpose: this file is generated into
# std's PAL, where there is no crate to name, so the one test that pins this page above the map is
# compiled here and never travels (the `byte_sink_protocol` precedent).
[dev-dependencies]
address_space_map = { version = "0.1.0", path = "../address_space_map" }
