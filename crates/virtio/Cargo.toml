[package]
name = "virtio"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
# The user address-space map (milestone 206 (a program image has under 896 KiB)): every fixed window here is checked against its band.
address_space_map = { version = "0.1.0", path = "../address_space_map" }
abi = { version = "0.1.0", path = "../abi" }
# The archive format, rather than a second copy of its offsets. This driver reads the nifefs
# directory out of a block-0 buffer, and when the entry layout changed on 2026-08-01 its hardcoded
# stride was the only place in the tree that had to be found by hand.
nifefs = { version = "0.1.0", path = "../nifefs" }
filesystem_protocol = { version = "0.1.0", path = "../filesystem_protocol" }
user_mode_runtime = { version = "0.1.0", path = "../user_mode_runtime" }
