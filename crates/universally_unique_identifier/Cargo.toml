[package]
name = "universally_unique_identifier"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The UUID of RFC 9562, as a value: sixteen bytes in the RFC's own byte order, the canonical text
# form, and the version-4 stamp over bytes a caller drew from somewhere unpredictable. No
# randomness and no I/O, so it compiles for the host and its tests run in milliseconds. Split out
# of `globally_unique_identifier_partition_table` on 2026-10-06 (UTC), because the `uuid` program
# and the partition table use the same identifier and only one of them stores it mixed-endian.

[lints]
workspace = true

