[package]
name = "designware_ethernet"
version = "0.1.0"
edition = "2024"
license.workspace = true

# no_std for the kernel and for `net_stack`, std for host tests, the §7 (the testing harness) pure-logic split every
# driver crate here uses. It owns what the halves of the JH7110's Ethernet driver agree on and
# everything either computes (milestone 53 (the board's own peripherals: network and storage on real silicon)): the Synopsys DesignWare
# Ethernet QoS controller's register map, its descriptor formats, the DMA region's layout, the
# spawn handoff, the receive and transmit ring logic, the controller and PHY bring-up sequences
# behind small traits, the DMA-coherence probe's verdict, and the JH7110 glue (the syscon interface
# select and the device-tree query). Host-tested against a simulated controller; nothing here
# dereferences a pointer.
#
# Name: PROVISIONAL (milestone 53's lane, 2026-10-06 UTC). See src/lib.rs's last paragraph for the
# argument and the alternative an architect may prefer.

[dependencies]
# For the virtual addresses the kernel maps and `net_stack` reads, which rule 7 puts here rather
# than in a "must match" comment on each side, as `e1000e` does.
address_space_map = { version = "0.1.0", path = "../address_space_map" }
# The device-tree query in `jh7110`, read against the same parser every other JH7110 crate uses.
device_tree_blob = { version = "0.1.0", path = "../device_tree_blob" }

[lints]
workspace = true
