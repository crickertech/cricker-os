# The argument page (milestone 205 (how a foreign program is told what to do), DECISIONS §170 (how a foreign program is told what to do)):
# the layout of the read-only page that carries a `std` program's argv as plain bytes. Pure logic,
# host-tested, no_std, dependency-free, so whoever assembles the page (the shell, and the kernel
# test harness) and whoever reads it (the std PAL's `sys/args`, generated from this file verbatim
# by `cargo xtask std-src`) share one definition and cannot drift. The same split
# `environment_protocol` makes for the configuration page. Name: provisional.

