[package]
name = "designware_mobile_storage"
version = "0.1.0"
edition = "2024"
license.workspace = true

# no_std for the kernel, std for host tests, the §7 (the testing harness) pure-logic split every
# driver crate here uses. It is the whole SD and eMMC driver for the JH7110's Synopsys DesignWare
# Mobile Storage Host Controller (milestone 53 (the board's own peripherals: network and storage on
# real silicon)): the register map, the command encoding, the polled controller sequences behind one
# small `Registers` trait, card identification and block I/O, the card registers' decoding, the MBR
# rule for where a write test may land, the bench step's two sequences, and the device-tree query.
# Host-tested against a simulated controller and card; nothing here dereferences a pointer.
#
# Name: PROVISIONAL (milestone 53's storage lane, 2026-10-06 UTC). The Synopsys databook's own
# name for the part, spelled out as `designware_ethernet` (the same lane's network half) spells
# its own. An architect may prefer `designware_mmc` (Linux's `dw_mmc`) or a name for what it does
# rather than whose IP it is.

[dependencies]
# The two windows the kernel maps and the block server reads, which rule 7 puts in one crate
# rather than in a "must match" comment on each side.
address_space_map = { version = "0.1.0", path = "../address_space_map" }
# The `blk` wire the block server answers, and its block size.
filesystem_protocol = { version = "0.1.0", path = "../filesystem_protocol" }
# The device-tree query in `jh7110`, read against the same parser every other JH7110 crate uses.
device_tree_blob = { version = "0.1.0", path = "../device_tree_blob" }

[lints]
workspace = true
