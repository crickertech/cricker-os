<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-label="How long the merge-group CI jobs take, in minutes">
<style>
  .bg{fill:#ffffff} .fg{fill:#1f2328} .mut{fill:#59636e} .grid{stroke:#d1d9e0}
  .seg{stroke:#ffffff;stroke-width:1} .tr{stroke:#1f2328;fill:none} .trd{fill:#1f2328}
  .val{paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round}
  .s0{fill:#2a78d6}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .fg{fill:#e6edf3} .mut{fill:#9198a1} .grid{stroke:#30363d}
    .seg{stroke:#0d1117} .val{stroke:#0d1117} .tr{stroke:#e6edf3} .trd{fill:#e6edf3} .s0{fill:#3987e5}}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="860" height="380"/>
<text class="fg" x="20" y="26" font-size="16" font-weight="600">How long the merge-group CI jobs take, in minutes</text>
<text class="mut" x="20" y="44" font-size="11">weekly medians of each day’s median run; the line is the slowest job of any name, and the ceiling is the 20-minute budget, with a warning from 17</text>
