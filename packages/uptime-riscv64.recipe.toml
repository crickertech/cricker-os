# uptime, as a riscv64 package.
#
# The same package as `uptime.recipe`, for the other architecture rung 3a's package tests run on.
# A recipe names one architecture because a digest is a fact about one set of bytes (DECISIONS §197
# (a package is one archive file): "per-architecture output is the normal case"), so a second
# architecture is a second recipe rather than a second line in the first. The digest line is absent
# for the reason `uptime.recipe` gives. Name: provisional 2026-09-24.

name = "uptime"
version = "0.1.0"
architecture = "riscv64"

[[member]]
program = "uptime"

[[member]]
name = "uptime.licence"
file = "LICENSE-MIT"
