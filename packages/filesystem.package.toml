# filesystem: the caretakers that attenuate a directory capability. nife's own grouping.
#
# Milestone 611 (every program and crate belongs to a package). The package's name, kind, home
# and membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.

name = "filesystem"
kind = "base"
home = { repo = "filesystem", status = "provisional" }
# Milestone 606 (a directory walk costs what it does on Linux), ruling D: the one crate a server
# links to enforce a subtree grant itself. The same job the caretakers do, so it lives with them;
# an interface because every eligible server, in whatever package, links it. Placement provisional.
interfaces = ["subtree_scope"]
programs = ["fs_file_caretaker", "fs_nameset_caretaker", "fs_subtree_caretaker"]
