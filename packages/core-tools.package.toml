# core-tools: the small general tools. date, printenv, rm and wc, which GNU coreutils holds, and
# uuid (uuidgen), which Debian ships in util-linux and uuid-runtime.
#
# Milestone 611 (every program and crate belongs to a package). The package's kind, home and
# membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.
#
# Name: ratified 2026-10-06 (calef, relayed to lane/disk-tools-rename). Asked "coreutils or
# core-tools?", he answered "core-tools". Refused `coreutils` (GNU's term of art, given up on
# purpose so the name matches `disk-tools` and the spelled-out rule against abbreviating
# "utilities"). `uuid` joined in the same day's ruling: "uuid can be used for lots of applications.
# Putting it in disk-utils doesn't seem right."

name = "core-tools"
kind = "base"
home = { repo = "core-tools", status = "provisional" }
programs = ["date", "printenv", "rm", "uuid", "wc"]
