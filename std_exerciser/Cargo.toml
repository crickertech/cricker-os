# The std demo workload (milestone 27): ordinary Rust, no attributes, no `no_std`, built for the
# `*-unknown-nife` custom targets with `-Zbuild-std` against the patched rust-src that carries
# the nife PAL (patches/std-nife; `cargo xtask std-src`).
#
# Deliberately NOT a member of the main workspace: it builds under the linked `nife-dev`
# toolchain with build-std flags the workspace crates must never inherit, and its target dir is
# its own. `cargo xtask std-exerciser` is the front door.

# Name: recorded (program `allocator_exerciser`, ratified 2026-08-01 by calef in milestone 63).
# The `_exerciser` half is not this package's coinage and was argued at length: 63 turned down
# `demo` as a suffix anywhere, on the ground that "exercise" is this tree's own verb, that memory,
# bus and disk exercisers have meant this for decades in real systems vocabulary, and that a demo
# shows something off where an exerciser puts a subsystem under load and sees whether it holds.
# That is exactly what this package does to `std` on nife. `std` is the standard library's own
# name. This is also the package the `script/names` blind spot was found through: it sat here for
# weeks answering "neither a name in the tree nor a recorded refusal", because the tool only
# looked in `crates/`, `components/src/`, `fixtures/src/` and `script/`. calef has not ratified it.

[package]
name = "std_exerciser"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]

# The FS-service contract's shared fixture (the file the test image ships and its exact bytes), so
# the demo, the host image builder, and the kernel test agree on one definition. `filesystem_protocol` is
# `no_std` and dependency-free, and the demo touches only its `fixture` module: it does NOT speak
# the wire protocol, because that is `std::fs`'s job now (the whole point of this milestone).
[dependencies]
filesystem_protocol = { path = "../crates/filesystem_protocol" }

# The socket contract's shared fixture (milestone 64's inbound half): the port the runners forward
# a host port to, the port no test grants, and the two strings the gate trades. Same reasoning as
# `filesystem_protocol` above and rule 7's: a port number two binaries agree on is a crate. The demo touches
# only `socket_protocol::fixture` and never the wire constants, because speaking the wire is
# `std::net`'s job now, which is this milestone's whole point.
socket_protocol = { path = "../crates/socket_protocol" }

# Milestone 121 (`ripgrep` on nife: enumeration as a capability)'s walk pricing: plain `std::fs` code that runs unchanged on a host, so the walk
# priced through a granted directory here is the same function a host comparison prices. It
# depends on `filesystem_protocol` alone, for the priced tree's shape.
walk_pricing = { path = "../crates/walk_pricing" }

# The kernel's ELF loader maps whole pages per segment and the initrd carries the file; keep the
# binary small and the build deterministic.
[profile.release]
opt-level = "s"
debug = false
strip = "debuginfo"
panic = "abort"

[profile.dev]
panic = "abort"
