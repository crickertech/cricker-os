name: Feature or scope request
description: Something nife should do that it does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Intended work lives in [`design/roadmap/`](https://github.com/crickertech/nife/tree/main/design/roadmap),
        not in issues.** That directory is the only status in the tree; anywhere else that claims
        status is stale by construction. So the outcome of this issue is a roadmap block, and what it
        needs from you is the material for one.

        There is no index: read [notes/roadmap.md](https://github.com/crickertech/nife/blob/main/notes/roadmap.md)
        for how a block is written, and search the directory for one that already covers this. Five
        hundred-odd blocks exist and duplicates are easy.

  - type: textarea
    id: want
    attributes:
      label: What you want it to do
      description: The capability, in one or two sentences. Not the implementation.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What it unblocks
      description: >-
        The ranking function here is the shortest path to a system a customer runs, so "who cannot do
        what today" ranks a request and "it would be nice" does not.
    validations:
      required: true

  - type: textarea
    id: existing
    attributes:
      label: Existing roadmap blocks you checked
      description: Numbers and names, or say that you looked and found none.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: What you think it costs, and what it would touch
      description: >-
        Optional, and a guess is fine. Anything touching the syscall surface, a wire format, a new
        dependency, or a name is expensive to unship and is an architect's call rather than a lane's.
    validations:
      required: false
