name: Design argument
description: You think a decision this project made is wrong, or a decision it has not made needs making.
labels: ["needs-architect"]
body:
  - type: markdown
    attributes:
      value: |
        **Arguments live in [`design/decisions/`](https://github.com/nifeos/nife/tree/main/design/decisions),
        including the ones that were refused.** That is on purpose: you can disagree with an argument,
        but not with an authority. So the outcome of this issue is a file in that directory with
        `**Status: PROPOSED.**`, and a pull request adding one directly is welcome and is faster.

        Read [`design/decisions/`](https://github.com/nifeos/nife/blob/main/design/decisions/README.md) and that
        directory's README before opening this. A decision that already exists usually carries the
        reason you are about to raise.

  - type: textarea
    id: decision
    attributes:
      label: What is being decided
      description: One sentence, phrased as a question with an answer that could go either way.
    validations:
      required: true

  - type: textarea
    id: existing
    attributes:
      label: What the tree does today, and where it says so
      description: >-
        The section, file, or note. If a decision was already recorded and refused, this is where that
        surfaces, and it usually ends the argument in one direction or the other.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: The options, and why each one loses
      description: >-
        A list of alternatives is not an answer; a refusal with a reason for each is. The refusals are
        the valuable half.
    validations:
      required: true

  - type: textarea
    id: reversible
    attributes:
      label: How reversible is it, and who has already acted on it
      description: >-
        The test is not "can the commit be reverted". Names, wire formats, dependencies, the syscall
        surface, and anything that has left the machine are the expensive category; almost everything
        else is an hour.
    validations:
      required: true
