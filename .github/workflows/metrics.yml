name: project metrics

# **Append this week's row; never change what a past week said.** The dashboard is
# notes/project-metrics.md and the data behind it is one CSV per measure in
# notes/project-metrics/, in the tree, versioned with the code it describes.
#
# The same three-step split `toolchain-bump.yml` uses, and for the same reason:
#
#   1. PROPOSE (here): recompute this week's row, redraw the charts, open a PR.
#   2. VERIFY (the CI workflow, on that PR): the ordinary gates.
#   3. ACCEPT (a human): merge.
#
# This job must never push to `main`. What it writes is a record other people will quote, and
# `AGENTS.md` puts "facts that leave the machine" in the irreversible category on purpose. A number
# that lands unreviewed is exactly the shape of the three instrument failures the page's own honesty
# section lists.
#
# **Daily recompute, weekly coverage.** calef asked for this on 2026-09-23: he is using the numbers
# to drive decisions more often than once a week. The row is still keyed by ISO week, so a daily run
# does not add a row; it rewrites the current week's row in place with whatever HEAD looks like that
# morning, which is the point (a current number between Mondays) rather than a series with more
# points in it.
#
# **Coverage stays on Monday, and every other day carries whatever cell the week already has.**
# `script/metrics` never recomputes `coverage_lines_pct` itself (CARRIED_FIELDS, script/metrics's own
# comment); it only ever writes that cell from an lcov file this workflow hands it. A day with no
# coverage build hands it nothing, so `--update` leaves the current week's cell exactly as Monday
# left it. Verified 2026-09-23 by forcing a sentinel value into the current week's row and running
# `--update` with no `--coverage-from`: the sentinel survived. A daily coverage build would multiply
# `script/coverage`'s cost by seven for a column nobody reads more than weekly, which is what made
# Monday-only the right split rather than a compromise.
#
# **The Monday/daily split does not, on its own, protect the columns a schema change adds.** On
# 2026-09-20 a merge conflict in the data, then one wide `weekly.csv` and since split per measure
# by milestone 581 (one metrics file per measure), was resolved by restoring an older copy (one still
# missing that week's newly merged `unsafe_trust_*` columns) and then running `--update`, which only
# ever rewrites the current week and any week missing entirely; every other existing row is left
# exactly as read. So the restored columns stayed blank on every past row for three days, until
# someone ran `--backfill`, which recomputes every row from git history rather than trusting what
# is already there. That is `--update`'s documented contract, not a bug in it: `--update` doing this
# more often (daily instead of weekly) does not add new exposure to that failure, because the trigger
# was the wrong command after a merge conflict, not the run frequency. The narrower claim two
# paragraphs below (`--update` heals a week that is entirely missing) is real and unrelated: verified
# 2026-09-23 by deleting a past week's row outright and re-running `--update`, which restored it.
#
# **Monday does not close the week that just ended**, which this header used to claim. `--update`
# writes the week HEAD's commit falls in, and on 2026-09-14 nine pull requests merged between 00:40
# and 05:49 UTC, so HEAD was already in 2026W38 when this fired and 2026W37 was never written. The
# fix is in `script/metrics`, not in the schedule: `--update` now also writes every week history has
# and the CSV lacks, and `--check` fails on a gap. No hour would have been safe, because lanes merge
# around the clock.
#
# **Nothing here builds the kernel.** `script/metrics` is ls-tree, cat-file and regular expressions,
# which is what lets it walk the whole history in seconds, and it is why coverage is the one column
# this workflow fills from a build rather than from git. That build is the ordinary host-crate
# coverage run, so its cost is `script/coverage`'s and not a second one.

on:
  schedule:
    # 06:00 UTC daily. Before the toolchain jobs, so a bump PR opened later that morning is not
    # competing with this one for a reviewer's attention on the same branch listing. The coverage
    # build inside the job still only runs on Mondays (see the "Is this the coverage day" step);
    # the header above says why.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: project-metrics
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    name: record this week
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      # The same identity argument `toolchain-bump.yml` makes at length: a PR opened with the
      # workflow's own `GITHUB_TOKEN` does not trigger further workflow runs, so its CI never starts
      # and the PR is permanently unmergeable. The `|| github.token` fallback keeps this job working
      # (it still opens the PR) when the secret is absent.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.TOOLCHAIN_BUMP_PAT || github.token }}
          # The backfill walks first-parent history, so a shallow clone would silently produce a
          # shorter series rather than an error. This is the failure mode worth spending a full
          # clone on: a suite whose scope is too small goes green faster.
          fetch-depth: 0

      # Runs every day; the build below does not. `coverage_lines_pct` is a CARRIED_FIELDS column
      # in `script/metrics` (its own comment), so a day that skips the build leaves the current
      # week's cell exactly as the last build left it rather than blanking it.
      - name: Is this the coverage day?
        id: day
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          fi

      # Coverage is the one metric `script/metrics` cannot re-derive, because it needs a build. It
      # is taken here on Mondays only, or any day by hand with `script/metrics --coverage-for` from
      # a checkout of the week's commit, which costs a worktree and a toolchain. `continue-on-error`
      # because a coverage failure is a coverage problem and the other twenty-odd columns should
      # still be recorded: the alternative is a week missing from the series for a reason unrelated
      # to anything the series measures.
      - name: Install cargo-llvm-cov
        id: covtool
        if: steps.day.outputs.coverage == 'true'
        continue-on-error: true
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        if: steps.day.outputs.coverage == 'true' && steps.covtool.outcome == 'success'

      - name: Measure host-crate coverage
        id: coverage
        if: steps.day.outputs.coverage == 'true' && steps.covtool.outcome == 'success'
        continue-on-error: true
        run: script/coverage

      - name: Recompute this week's row and redraw the charts
        run: |
          set -e
          if [ "${{ steps.coverage.outcome }}" = "success" ] && [ -f target/llvm-cov/lcov.info ]; then
            # Two files, two cells. The lcov gives the aggregate the trend chart plots; floor.txt
            # gives the minimum per file, which is the number that can actually fail this build.
            # Only `script/coverage` can produce the second, because the exemptions that decide
            # which files the floor acts on live there.
            script/metrics --update --coverage-from target/llvm-cov/lcov.info \
              --coverage-min-from target/llvm-cov/floor.txt
          else
            echo "No lcov file; recording every column but coverage, which leaves the cell as it was."
            script/metrics --update
          fi

      # `script/metrics --update` is idempotent by construction (the CSV is rewritten from a dict
      # keyed by week, never appended to), so "no diff" is the normal outcome on a quiet day and
      # must be silent rather than an empty PR.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.TOOLCHAIN_BUMP_PAT || github.token }}
        run: |
          set -e
          # The page too, not only the directory: `script/metrics` writes generated lines onto
          # notes/project-metrics.md (the table of contents, the bold backlog's line, the drift
          # line), and the pathspec `notes/project-metrics` does not match that file. Until
          # 2026-09-26 those lines were rewritten here and then dropped.
          if git diff --quiet -- notes/project-metrics notes/project-metrics.md; then
            echo "Nothing moved this week; no pull request."
            exit 0
          fi
          branch="metrics/weekly"
          week="$(date -u +%GW%V)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add notes/project-metrics notes/project-metrics.md
          git commit -m "metrics: record $week

          Recomputed by the scheduled workflow. Every column but coverage is a restatement: the row
          applies today's definitions to this week's tree, which is what makes the series comparable
          and is not what any of these numbers were reported as at the time.

          notes/project-metrics.md says so on its face; this commit changes only its generated lines."
          git push --force origin "$branch"
          title="metrics: record $week"
          body="**Lane:** $branch, opened by a scheduled workflow; calef's account is the author GitHub shows.

          Adds or refreshes the \`$week\` row in each measure's CSV under
          \`notes/project-metrics/\` and redraws the SVGs beside them. The page is
          [\`notes/project-metrics.md\`](../blob/main/notes/project-metrics.md).

          **Read the diff, not just the charts.** Every column is a restatement under today's
          definitions, and this project found three of its own instruments wrong in a single day
          (2026-09-02). A row that jumps for a reason nobody can name is a defect in an instrument
          until somebody says otherwise.

          This branch is force-pushed on every run that changed something (daily, coverage refreshed
          Mondays), so it proposes the newest row rather than accumulating one pull request per run."
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -z "$existing" ]; then
            gh pr create --head "$branch" --base main --title "$title" --body "$body"
          else
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated PR #$existing in place."
          fi
