name: observed-failing probe

# Observed failing: never. A workflow added after the observed-failing cutoff commit, saying
#   `never`, so that script/lint's observed-failing check has to refuse it. This file exists for one
#   CI run and is deleted by the commit after it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "never run; this file exists to be refused by script/lint"
